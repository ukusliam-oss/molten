<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molten — interactive web studio</title>
<meta name="description" content="Molten is a small studio for websites that move like liquid.">
<meta name="theme-color" content="#ffb41f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;900&family=Mr+Dafoe&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<header class="nav">
  <a class="nav__mark" href="#top" aria-label="Molten, back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
  </a>
  <a class="nav__logo" href="#top" aria-hidden="true" tabindex="-1">
    <svg viewBox="0 0 58 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <ellipse cx="29" cy="12" rx="27" ry="10.5"/>
      <ellipse cx="29" cy="12" rx="18" ry="10.5"><animate attributeName="rx" values="27;0;27" dur="5s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="29" cy="12" rx="9" ry="10.5"><animate attributeName="rx" values="0;27;0" dur="5s" repeatCount="indefinite"/></ellipse>
      <path d="M5.3 7h47.4M2 12h54M5.3 17h47.4"/>
    </svg>
  </a>
  <nav class="nav__links" aria-label="Sections">
    <a class="pill" href="#top" data-action="about">About</a>
    <a class="pill" href="#top" data-action="list">Work</a>
    <a class="pill" href="#top" data-action="contact">Contact</a>
  </nav>
</header>

<main>
  <section class="hero" id="top">
    <canvas class="hero__gl" aria-hidden="true"></canvas>
    <h1 class="sr-only">Molten — a console for the things I make</h1>
  </section>
</main>

<div class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer__inner">
    <figure class="viewer__media">
      <img class="viewer__img" alt="">
      <figcaption class="viewer__cap"></figcaption>
      <div class="viewer__nav">
        <button class="round" type="button" data-step="-1" aria-label="Previous screen">←</button>
        <span class="viewer__count"></span>
        <button class="round" type="button" data-step="1" aria-label="Next screen">→</button>
      </div>
    </figure>
    <div class="viewer__text">
      <p class="viewer__kind"></p>
      <h2 class="viewer__title" id="viewer-title"></h2>
      <p class="viewer__story"></p>
      <ul class="viewer__facts"></ul>
      <p class="viewer__updated"></p>
      <div class="viewer__actions">
        <a class="viewer__link" target="_blank" rel="noopener">Open the live site ↗</a>
        <button class="pill viewer__close" type="button">Back · B</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
